[project]
name = "content-based-image-retrieval"
version = "0.0.0"
description = "The goal is to find the best algorithm for content-based image retrieval."
authors = [
    {name = "schalappe", email = "71593784+schalappe@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
# ##: Tested on 3.14 only; widen after testing another version.
requires-python = ">=3.14,<3.15"
dependencies = [
    "polars>=2.0.0",
    "scikit-learn>=1.9.1",
    "rich>=13.9.4",
    "python-dotenv>=1.0.1",
    "opencv-contrib-python>=5.0",  # ##: AKAZE lives in contrib (`cv.xfeatures2d`) since OpenCV 5.
    "torch>=2.14.1",
    "timm>=1.0.30",
    "kagglehub>=0.3.6",
]

[dependency-groups]
dev = ["ruff>=0.17.1"]
notebook = [
    "jupyterlab>=4.3.6",
    "matplotlib>=3.10.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
